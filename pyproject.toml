[project]
name = "archive-be"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# 직접 의존성과 허용 범위만 선언한다. 실제 설치 버전(하위 의존성 포함)은 uv.lock 이 고정한다.
# 상한은 다음 메이저 미만 — 단 sqlalchemy 는 2.1 이 greenlet 을 기본 의존성에서 빼면서
# asyncio 엔진이 import 시점에 죽었던 전례가 있어, 검증 전까지 2.0.x 로 묶는다.
dependencies = [
    # Web
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    # Database
    "sqlalchemy[asyncio]>=2.0.0,<2.1",
    "alembic>=1.14.0,<2",
    "asyncpg>=0.30.0,<1",
    "pgvector>=0.3.0,<1",
    # Cache / Queue
    "redis>=5.2.0,<7",
    "celery[redis]>=5.4.0,<6",
    "celery-aio-pool==0.1.0rc8",
    # SSE
    "sse-starlette>=2.1.0,<4",
    # IoC Container
    "dishka>=0.14.0,<2",
    # Settings
    "pydantic[email]>=2.9.0,<3",
    "pydantic-settings>=2.7.0,<3",
    # Auth
    "python-jose[cryptography]>=3.3.0,<4",
    "pwdlib[argon2]>=0.2.1,<0.3",
    # AI / External APIs
    "google-genai>=1.0.0,<3",
    "httpx>=0.28.0,<1",
    # Email
    "aiosmtplib>=3.0.0,<6",
    "jinja2>=3.1.0,<4",
    # UUID / Logging / Country·Timezone — calver 라 상한 없음 (lock 이 고정)
    "uuid6>=2024.7.10",
    "structlog>=24.4.0",
    "pycountry>=24.6.1",
    "pytz>=2024.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0,<1",
    "mypy>=1.14.0,<3",
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.24.0,<2",
]

[tool.uv]
# 앱은 설치형 패키지가 아니라 PYTHONPATH=src 로 실행한다 — 프로젝트 자체는 venv 에 설치하지 않는다.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
# 검사 대상을 설정에 박아 인자 없이 `mypy` 만으로 돌게 한다. explicit_package_bases 가
# 없으면 mypy 가 같은 파일을 app.x / src.app.x 두 모듈로 보고 검사 전에 멈춘다
# ("Source file found twice under different module names") — 그동안 타입 검사가
# 사실상 꺼져 있던 원인이다 (#12).
packages = ["app"]
explicit_package_bases = true

# 스텁이 없는 서드파티 — 이쪽 에러는 우리 코드의 신호가 아니라 잡음이라 끈다.
[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "pytz.*", "jose.*"]
ignore_missing_imports = true

# celery 의 @task 데코레이터가 untyped 라, 태스크 함수마다 untyped-decorator 가 뜬다.
# 우리가 고칠 수 있는 문제가 아니므로 워커 모듈에서만 이 검사를 끈다.
[[tool.mypy.overrides]]
module = ["app.worker.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
