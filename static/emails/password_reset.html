<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="color-scheme" content="dark">
    <meta name="supported-color-schemes" content="dark light">
    <title>ARCHIVE 비밀번호 재설정</title>
    <style>
        body, table, td { margin: 0; padding: 0; }
        img { border: 0; line-height: 100%; outline: none; text-decoration: none; }
        a { text-decoration: none; }
        @media screen and (max-width: 600px) {
            .container { width: 100% !important; }
            .outer-pad { padding: 32px 16px !important; }
            .card { padding: 36px 24px !important; border-radius: 16px !important; }
            .headline { font-size: 28px !important; line-height: 1.15 !important; letter-spacing: -0.4px !important; }
            .lead { font-size: 16px !important; line-height: 1.5 !important; }
            .cta { font-size: 16px !important; padding: 14px 28px !important; }
            .expiry-note { font-size: 13px !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #000000; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;">

    <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all; font-size: 1px; line-height: 1px; color: #000000;">
        비밀번호 재설정 — 링크는 {{ expires_minutes }}분간 유효합니다.
    </div>

    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #000000; min-width: 100%;">
        <tr>
            <td class="outer-pad" align="center" style="padding: 56px 24px;">
                <table role="presentation" class="container" cellspacing="0" cellpadding="0" border="0" width="560" style="max-width: 560px; width: 100%;">

                    <!-- Wordmark -->
                    <tr>
                        <td align="center" style="padding-bottom: 44px;">
                            <span style="display: inline-block; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; color: #f5f5f7; letter-spacing: 0.36em;">
                                ARCHIVE
                            </span>
                        </td>
                    </tr>

                    <!-- Card -->
                    <tr>
                        <td>
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #1c1c1e; border-radius: 22px;">
                                <tr>
                                    <td class="card" style="padding: 48px 40px;">

                                        <h1 class="headline" style="margin: 0 0 16px 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 700; color: #f5f5f7; letter-spacing: -0.5px; line-height: 1.18;">
                                            비밀번호 재설정
                                        </h1>

                                        <p class="lead" style="margin: 0 0 32px 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 17px; line-height: 1.5; color: #a1a1a6;">
                                            아래 버튼을 눌러 새 비밀번호를 설정해 주세요.
                                        </p>

                                        <!-- CTA Button -->
                                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="left" style="margin: 0 0 28px 0;">
                                            <tr>
                                                <td align="center" style="border-radius: 999px; background-color: #0a84ff;">
                                                    <a href="{{ reset_url }}" class="cta" style="display: inline-block; padding: 14px 36px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 600; color: #ffffff; letter-spacing: -0.1px;">
                                                        비밀번호 재설정
                                                    </a>
                                                </td>
                                            </tr>
                                        </table>

                                        <p class="expiry-note" style="margin: 0 0 16px 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.5; color: #8e8e93;">
                                            이 링크는 <strong style="color: #f5f5f7;">{{ expires_minutes }}분</strong> 동안만 유효합니다.
                                        </p>

                                        <p style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.5; color: #636366; word-break: break-all;">
                                            버튼이 동작하지 않으면 다음 주소를 직접 입력해 주세요.<br/>
                                            <span style="color: #8e8e93;">{{ reset_url }}</span>
                                        </p>

                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center" style="padding-top: 32px;">
                            <p style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; line-height: 1.5; color: #636366;">
                                본인이 요청하지 않았다면 이 메일을 무시해 주세요.
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
